<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartHire — Aptitude Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 16px;
        }

        .timer {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #ff4757;
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
            z-index: 1000;
        }

        .timer.warning {
            background: #ffa502;
            animation: pulse 1s infinite;
        }

        .timer.danger {
            background: #ff4757;
            animation: pulse 0.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .question-card {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .question-card:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .question-card.answered {
            border-left-color: #2ed573;
            background: #f0fff4;
        }

        .question-number {
            color: #667eea;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .question-text {
            color: #333;
            font-size: 18px;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .options {
            display: grid;
            gap: 10px;
        }

        .option {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option:hover {
            border-color: #667eea;
            background: #f0f0ff;
        }

        .option input[type="radio"] {
            margin-right: 12px;
            cursor: pointer;
        }

        .option.selected {
            border-color: #667eea;
            background: #e8e8ff;
        }

        .option label {
            cursor: pointer;
            flex: 1;
            font-size: 16px;
            color: #333;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: #e0e0e0;
            border-radius: 5px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s ease;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: block;
            margin: 30px auto 0;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .results {
            text-align: center;
        }

        .results h2 {
            color: #333;
            margin-bottom: 20px;
        }

        .score-circle {
            width: 200px;
            height: 200px;
            margin: 0 auto 30px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 48px;
            font-weight: bold;
            color: white;
        }

        .score-circle.high {
            background: linear-gradient(135deg, #2ed573, #7bed9f);
        }

        .score-circle.medium {
            background: linear-gradient(135deg, #ffa502, #ffda79);
        }

        .score-circle.low {
            background: linear-gradient(135deg, #ff4757, #ff6b81);
        }

        .section-breakdown {
            text-align: left;
            margin-top: 30px;
        }

        .section-breakdown h3 {
            color: #333;
            margin-bottom: 15px;
        }

        .section-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 15px;
            background: #f8f9fa;
            margin-bottom: 10px;
            border-radius: 5px;
        }

        .cheat-warning {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #ff4757;
            color: white;
            padding: 30px 50px;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
            display: none;
            z-index: 2000;
            text-align: center;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="timer hidden" id="timer">30:00</div>

    <div class="cheat-warning" id="cheatWarning">
        ⚠️ WARNING: Tab switch detected!<br>
        <small>This incident has been recorded.</small>
    </div>

    <div class="container" id="loginContainer">
        <div class="header">
            <h1>SmartHire — Aptitude Test</h1>
            <p>Click the button below to begin the assessment</p>
        </div>
        <button class="btn" onclick="startTest()">Start Test</button>
    </div>

    <div class="container hidden" id="testContainer">
        <div class="header">
            <h1>Aptitude Assessment</h1>
            <p id="progressText">Question 0 of 0 answered</p>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill" style="width: 0%"></div>
        </div>

        <div id="questionsContainer"></div>

        <button class="btn" id="submitBtn" onclick="submitTest()">Submit Test</button>
    </div>

    <div class="container hidden" id="resultsContainer">
        <div class="results">
            <h2>Test Completed!</h2>
            <div class="score-circle" id="scoreCircle">0%</div>
            <h3 id="scoreText">Calculating...</h3>
            <div class="section-breakdown" id="sectionBreakdown"></div>
        </div>
    </div>

    <script>
        let candidateId = 'candidate-' + Math.random().toString(36).substr(2, 9);
        let timeRemaining = 30 * 60; // 30 minutes in seconds
        let timerInterval = null;
        let answers = {};
        let totalQuestions = 0;
        let tabSwitches = 0;
        let isSubmitting = false;

        // Anti-cheat: detect tab switches / window blur
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && !isSubmitting) {
                tabSwitches++;
                showCheatWarning();
            }
        });

        window.addEventListener('blur', () => {
            if (!isSubmitting) {
                tabSwitches++;
                showCheatWarning();
            }
        });

        function showCheatWarning() {
            const warning = document.getElementById('cheatWarning');
            warning.style.display = 'block';
            setTimeout(() => {
                warning.style.display = 'none';
            }, 3000);
        }

        async function startTest() {
            try {
                const response = await fetch('http://localhost:5001/api/aptitude/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ candidate_id: candidateId, role: 'general', questions_per_section: 5 })
                });

                if (!response.ok) {
                    const error = await response.json();
                    alert(error.error || 'Failed to start test.');
                    return;
                }

                const data = await response.json();
                renderQuestions(data.questions);
                totalQuestions = data.total_questions;
                timeRemaining = data.time_limit_minutes * 60;

                document.getElementById('loginContainer').classList.add('hidden');
                document.getElementById('testContainer').classList.remove('hidden');
                document.getElementById('timer').classList.remove('hidden');

                startTimer();
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        function renderQuestions(questions) {
            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';

            questions.forEach((q, index) => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `question-${q.id}`;

                card.innerHTML = `
                    <div class="question-number">Question ${index + 1} — ${q.section} (${q.difficulty})</div>
                    <div class="question-text">${q.question}</div>
                    <div class="options">
                        ${q.options.map((opt, i) => `
                            <div class="option" onclick="selectAnswer('${q.id}', '${opt}', this)">
                                <input type="radio" name="q-${q.id}" id="opt-${q.id}-${i}">
                                <label for="opt-${q.id}-${i}">${opt}</label>
                            </div>
                        `).join('')}
                    </div>
                `;

                container.appendChild(card);
            });
        }

        function selectAnswer(questionId, answer, element) {
            // Remove previous selection
            const card = document.getElementById(`question-${questionId}`);
            card.querySelectorAll('.option').forEach(opt => opt.classList.remove('selected'));

            // Mark new selection
            element.classList.add('selected');
            element.querySelector('input').checked = true;

            // Store answer
            answers[questionId] = answer;
            card.classList.add('answered');

            updateProgress();
        }

        function updateProgress() {
            const answered = Object.keys(answers).length;
            const percentage = (answered / totalQuestions) * 100;

            document.getElementById('progressFill').style.width = `${percentage}%`;
            document.getElementById('progressText').textContent = `Question ${answered} of ${totalQuestions} answered`;
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeRemaining--;
                const minutes = Math.floor(timeRemaining / 60);
                const seconds = timeRemaining % 60;

                const timerEl = document.getElementById('timer');
                timerEl.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

                if (timeRemaining <= 300) { // 5 minutes
                    timerEl.classList.add('danger');
                } else if (timeRemaining <= 600) { // 10 minutes
                    timerEl.classList.add('warning');
                }

                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    submitTest();
                }
            }, 1000);
        }

        async function submitTest() {
            // Set flag before showing dialog to prevent tab switch detection
            isSubmitting = true;

            if (!confirm('Are you sure you want to submit?')) {
                isSubmitting = false;
                return;
            }

            clearInterval(timerInterval);

            // Submit all answers sequentially to avoid race conditions
            try {
                // First, verify backend is reachable
                try {
                    const healthCheck = await fetch('http://localhost:5001/api/aptitude/bank', {
                        method: 'GET',
                        signal: AbortSignal.timeout(3000)
                    });
                    
                    if (!healthCheck.ok) {
                        throw new Error('Backend server is not responding properly');
                    }
                } catch (healthError) {
                    throw new Error('Cannot connect to backend server. Please ensure the backend is running on port 5001.');
                }

                // Submit all answers
                for (const [qId, answer] of Object.entries(answers)) {
                    const response = await fetch('http://localhost:5001/api/aptitude/submit-answer', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ candidate_id: candidateId, question_id: qId, answer: answer }),
                        signal: AbortSignal.timeout(5000)
                    });
                    
                    if (!response.ok) {
                        const error = await response.json();
                        console.error('Failed to submit answer for question:', qId, error);
                    }
                }

                // Submit test for grading after all answers are recorded
                const submitResponse = await fetch('http://localhost:5001/api/aptitude/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ candidate_id: candidateId }),
                    signal: AbortSignal.timeout(10000)
                });

                if (!submitResponse.ok) {
                    const errorData = await submitResponse.json();
                    throw new Error(errorData.error || 'Failed to submit test');
                }

                const data = await submitResponse.json();
                isSubmitting = false;
                showResults(data.results);
            } catch (error) {
                isSubmitting = false;
                console.error('Submission error:', error);
                
                let errorMessage = 'Error submitting test: ';
                if (error.name === 'TypeError' && error.message.includes('fetch')) {
                    errorMessage += 'Cannot connect to server. Please check if the backend is running on port 5001.';
                } else if (error.name === 'AbortError') {
                    errorMessage += 'Request timed out. The server might be slow or unresponsive.';
                } else {
                    errorMessage += error.message;
                }
                
                alert(errorMessage);
            }
        }

        function showResults(results) {
            document.getElementById('testContainer').classList.add('hidden');
            document.getElementById('timer').classList.add('hidden');
            document.getElementById('resultsContainer').classList.remove('hidden');

            const percentage = results.percentage;
            const circle = document.getElementById('scoreCircle');
            circle.textContent = `${percentage}%`;

            if (percentage >= 70) {
                circle.className = 'score-circle high';
            } else if (percentage >= 50) {
                circle.className = 'score-circle medium';
            } else {
                circle.className = 'score-circle low';
            }

            document.getElementById('scoreText').textContent = 
                `You scored ${results.total_score} out of ${results.total_questions}`;

            // Section breakdown
            const breakdown = document.getElementById('sectionBreakdown');
            breakdown.innerHTML = '<h3>Section Breakdown</h3>';

            for (const [section, scores] of Object.entries(results.sections)) {
                const item = document.createElement('div');
                item.className = 'section-item';
                item.innerHTML = `
                    <span>${section.replace(/_/g, ' ').toUpperCase()}</span>
                    <strong>${scores.correct}/${scores.total} (${scores.percentage}%)</strong>
                `;
                breakdown.appendChild(item);
            }

            if (tabSwitches > 0) {
                const warning = document.createElement('div');
                warning.style.cssText = 'color: #ff4757; margin-top: 20px; font-weight: bold;';
                warning.textContent = `⚠️ ${tabSwitches} tab switch(es) detected during this session.`;
                breakdown.appendChild(warning);
            }
        }
    </script>
</body>
</html>
