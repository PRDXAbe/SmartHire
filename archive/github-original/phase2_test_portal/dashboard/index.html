<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartHire — Recruiter Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 30px;
        }

        .dashboard {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .header h1 {
            color: #333;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 16px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .stat-card .stat-number {
            font-size: 48px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }

        .stat-card .stat-label {
            color: #666;
            font-size: 14px;
        }

        .leaderboard {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .leaderboard h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .filter-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            align-items: center;
        }

        .filter-bar input,
        .filter-bar select {
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }

        .filter-bar input {
            flex: 1;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
        }

        tbody tr:hover {
            background: #f8f9fa;
        }

        .rank-badge {
            display: inline-block;
            width: 40px;
            height: 40px;
            line-height: 40px;
            text-align: center;
            border-radius: 50%;
            font-weight: bold;
            color: white;
        }

        .rank-badge.gold {
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            color: #333;
        }

        .rank-badge.silver {
            background: linear-gradient(135deg, #c0c0c0, #e8e8e8);
            color: #333;
        }

        .rank-badge.bronze {
            background: linear-gradient(135deg, #cd7f32, #daa06d);
        }

        .rank-badge.default {
            background: #667eea;
        }

        .score-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
        }

        .score-bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        .score-bar-fill.high {
            background: #2ed573;
        }

        .score-bar-fill.medium {
            background: #ffa502;
        }

        .score-bar-fill.low {
            background: #ff4757;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 40px;
            max-width: 800px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h3 {
            color: #333;
            font-size: 24px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #666;
        }

        .close-btn:hover {
            color: #333;
        }

        .detail-section {
            margin-bottom: 25px;
        }

        .detail-section h4 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 18px;
        }

        .detail-table {
            width: 100%;
            border-collapse: collapse;
        }

        .detail-table td {
            padding: 10px;
            border-bottom: 1px solid #f0f0f0;
        }

        .detail-table td:first-child {
            font-weight: bold;
            color: #333;
            width: 40%;
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }

            table {
                font-size: 12px;
            }

            th, td {
                padding: 10px 5px;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <h1>SmartHire Recruiter Dashboard</h1>
            <p>View ranked candidates and generate assessment reports</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="totalCandidates">0</div>
                <div class="stat-label">Total Candidates</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="avgScore">0%</div>
                <div class="stat-label">Average Score</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="topCandidates">0</div>
                <div class="stat-label">Top Performers (>70%)</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="reportsGenerated">0</div>
                <div class="stat-label">Reports Generated</div>
            </div>
        </div>

        <div class="leaderboard">
            <h2>Candidate Rankings</h2>
            
            <div class="filter-bar">
                <input type="text" id="searchInput" placeholder="Search by name or email..." oninput="filterCandidates()">
                <select id="roleFilter" onchange="filterCandidates()">
                    <option value="">All Roles</option>
                    <option value="swe">Software Engineer</option>
                    <option value="ds">Data Scientist</option>
                    <option value="ml">ML Engineer</option>
                    <option value="backend">Backend Developer</option>
                    <option value="data_eng">Data Engineer</option>
                </select>
                <button class="btn" onclick="refreshRankings()">Refresh</button>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Composite</th>
                        <th>Aptitude</th>
                        <th>Coding</th>
                        <th>Interview</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="leaderboardBody">
                    <tr>
                        <td colspan="8" style="text-align: center; padding: 40px; color: #888;">
                            Loading candidate data...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="modal" id="candidateModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Candidate Details</h3>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div id="modalBody"></div>
            <button class="btn" onclick="downloadReport()" style="margin-top: 20px;">Download PDF Report</button>
        </div>
    </div>

    <script>
        let candidates = [];
        let selectedCandidateId = null;

        async function refreshRankings() {
            try {
                // In production, this would call the backend API
                // For now, using mock data
                candidates = getMockCandidates();
                renderLeaderboard(candidates);
                updateStats(candidates);
            } catch (error) {
                console.error('Error loading rankings:', error);
            }
        }

        function getMockCandidates() {
            return [
                {
                    rank: 1,
                    candidate_id: "cand_001",
                    name: "Alice Johnson",
                    email: "alice@example.com",
                    composite_score: 92.5,
                    aptitude_score: 95.0,
                    coding_score: 90.0,
                    interview_score: 92.0
                },
                {
                    rank: 2,
                    candidate_id: "cand_002",
                    name: "Bob Smith",
                    email: "bob@example.com",
                    composite_score: 85.0,
                    aptitude_score: 82.0,
                    coding_score: 88.0,
                    interview_score: 85.0
                },
                {
                    rank: 3,
                    candidate_id: "cand_003",
                    name: "Charlie Brown",
                    email: "charlie@example.com",
                    composite_score: 78.5,
                    aptitude_score: 80.0,
                    coding_score: 75.0,
                    interview_score: 80.0
                }
            ];
        }

        function renderLeaderboard(data) {
            const tbody = document.getElementById('leaderboardBody');
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 40px; color: #888;">No candidates found</td></tr>';
                return;
            }

            data.forEach(c => {
                const row = document.createElement('tr');

                const rankClass = c.rank === 1 ? 'gold' : c.rank === 2 ? 'silver' : c.rank === 3 ? 'bronze' : 'default';

                row.innerHTML = `
                    <td><span class="rank-badge ${rankClass}">${c.rank}</span></td>
                    <td><strong>${c.name}</strong></td>
                    <td>${c.email}</td>
                    <td>
                        <strong>${c.composite_score}%</strong>
                        <div class="score-bar">
                            <div class="score-bar-fill ${getScoreClass(c.composite_score)}" style="width: ${c.composite_score}%"></div>
                        </div>
                    </td>
                    <td>${c.aptitude_score}%</td>
                    <td>${c.coding_score}%</td>
                    <td>${c.interview_score}%</td>
                    <td>
                        <button class="btn btn-small" onclick="viewCandidate('${c.candidate_id}')">View Details</button>
                    </td>
                `;

                tbody.appendChild(row);
            });
        }

        function getScoreClass(score) {
            if (score >= 70) return 'high';
            if (score >= 50) return 'medium';
            return 'low';
        }

        function updateStats(data) {
            document.getElementById('totalCandidates').textContent = data.length;

            const avg = data.length > 0 
                ? (data.reduce((sum, c) => sum + c.composite_score, 0) / data.length).toFixed(1)
                : 0;
            document.getElementById('avgScore').textContent = `${avg}%`;

            const topCount = data.filter(c => c.composite_score > 70).length;
            document.getElementById('topCandidates').textContent = topCount;

            document.getElementById('reportsGenerated').textContent = '0'; // Track in production
        }

        function filterCandidates() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const role = document.getElementById('roleFilter').value;

            const filtered = candidates.filter(c => {
                const matchesSearch = !search || 
                    c.name.toLowerCase().includes(search) || 
                    c.email.toLowerCase().includes(search);
                return matchesSearch;
            });

            renderLeaderboard(filtered);
        }

        function viewCandidate(candidateId) {
            selectedCandidateId = candidateId;
            const candidate = candidates.find(c => c.candidate_id === candidateId);
            if (!candidate) return;

            document.getElementById('modalTitle').textContent = candidate.name;
            document.getElementById('modalBody').innerHTML = `
                <div class="detail-section">
                    <h4>Candidate Information</h4>
                    <table class="detail-table">
                        <tr><td>Email</td><td>${candidate.email}</td></tr>
                        <tr><td>Rank</td><td>#${candidate.rank}</td></tr>
                    </table>
                </div>
                <div class="detail-section">
                    <h4>Assessment Scores</h4>
                    <table class="detail-table">
                        <tr><td>Composite Score</td><td><strong>${candidate.composite_score}%</strong></td></tr>
                        <tr><td>Aptitude</td><td>${candidate.aptitude_score}%</td></tr>
                        <tr><td>Coding</td><td>${candidate.coding_score}%</td></tr>
                        <tr><td>Interview</td><td>${candidate.interview_score}%</td></tr>
                    </table>
                </div>
                <div class="detail-section">
                    <h4>Score Breakdown</h4>
                    <div class="score-bar" style="margin-bottom: 10px;">
                        <div class="score-bar-fill ${getScoreClass(candidate.composite_score)}" style="width: ${candidate.composite_score}%"></div>
                    </div>
                </div>
            `;

            document.getElementById('candidateModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('candidateModal').classList.remove('active');
        }

        function downloadReport() {
            if (!selectedCandidateId) return;
            alert(`Downloading PDF report for candidate ${selectedCandidateId}...\n(In production, this triggers PDF download)`);
        }

        // Close modal on outside click
        document.getElementById('candidateModal').addEventListener('click', (e) => {
            if (e.target.id === 'candidateModal') {
                closeModal();
            }
        });

        // Initial load
        refreshRankings();
    </script>
</body>
</html>
