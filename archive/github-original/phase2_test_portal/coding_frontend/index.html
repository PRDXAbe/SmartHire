<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartHire — Coding Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #1e1e1e;
            color: #d4d4d4;
            min-height: 100vh;
        }

        .header {
            background: #2d2d30;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #007acc;
        }

        .header h1 {
            color: #ffffff;
            font-size: 24px;
        }

        .header-info {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .header-info span {
            color: #cccccc;
            font-size: 14px;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
            height: calc(100vh - 70px);
        }

        .problem-panel {
            background: #252526;
            padding: 25px;
            overflow-y: auto;
            border-right: 1px solid #3e3e42;
        }

        .editor-panel {
            display: flex;
            flex-direction: column;
            background: #1e1e1e;
        }

        .problem-title {
            color: #569cd6;
            font-size: 26px;
            margin-bottom: 10px;
        }

        .problem-difficulty {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .problem-difficulty.easy {
            background: #4caf50;
            color: white;
        }

        .problem-difficulty.medium {
            background: #ff9800;
            color: white;
        }

        .problem-difficulty.hard {
            background: #f44336;
            color: white;
        }

        .problem-description {
            color: #d4d4d4;
            font-size: 15px;
            line-height: 1.7;
            margin-bottom: 25px;
            white-space: pre-wrap;
        }

        .example {
            background: #1e1e1e;
            border-left: 3px solid #007acc;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 4px;
        }

        .example h4 {
            color: #569cd6;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .example p {
            color: #ce9178;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 13px;
            margin: 5px 0;
        }

        .constraints {
            margin-top: 20px;
        }

        .constraints h4 {
            color: #569cd6;
            margin-bottom: 10px;
        }

        .constraints ul {
            color: #d4d4d4;
            padding-left: 20px;
        }

        .constraints li {
            margin: 5px 0;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 13px;
        }

        .editor-toolbar {
            background: #2d2d30;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #3e3e42;
        }

        .toolbar-left {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .toolbar-left label {
            color: #cccccc;
            font-size: 14px;
        }

        .toolbar-left select {
            background: #3e3e42;
            color: #d4d4d4;
            border: 1px solid #555;
            padding: 5px 10px;
            border-radius: 4px;
        }

        .toolbar-right {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 20px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-run {
            background: #4caf50;
            color: white;
        }

        .btn-run:hover {
            background: #45a049;
        }

        .btn-submit {
            background: #007acc;
            color: white;
        }

        .btn-submit:hover {
            background: #005a9e;
        }

        .btn:disabled {
            background: #555;
            cursor: not-allowed;
        }

        #editor {
            flex: 1;
            min-height: 0;
        }

        .output-panel {
            background: #1e1e1e;
            border-top: 1px solid #3e3e42;
            padding: 15px 20px;
            max-height: 200px;
            overflow-y: auto;
        }

        .output-panel h4 {
            color: #569cd6;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .output-content {
            background: #252526;
            padding: 12px;
            border-radius: 4px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 13px;
            color: #d4d4d4;
            white-space: pre-wrap;
            min-height: 50px;
        }

        .output-content.error {
            color: #f44336;
        }

        .output-content.success {
            color: #4caf50;
        }

        .results-container {
            padding: 30px;
        }

        .result-summary {
            text-align: center;
            margin-bottom: 30px;
        }

        .result-score {
            font-size: 64px;
            font-weight: bold;
            color: #4caf50;
        }

        .result-score.failed {
            color: #f44336;
        }

        .test-case-results {
            margin-top: 20px;
        }

        .test-case {
            background: #252526;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .test-case.passed {
            border-left: 4px solid #4caf50;
        }

        .test-case.failed {
            border-left: 4px solid #f44336;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-badge.passed {
            background: #4caf50;
            color: white;
        }

        .status-badge.failed {
            background: #f44336;
            color: white;
        }

        .hidden {
            display: none;
        }

        .problem-selector {
            background: #252526;
            padding: 15px 25px;
            border-bottom: 1px solid #3e3e42;
        }

        .problem-selector label {
            color: #cccccc;
            margin-right: 10px;
        }

        .problem-selector select {
            background: #3e3e42;
            color: #d4d4d4;
            border: 1px solid #555;
            padding: 8px 15px;
            border-radius: 4px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>SmartHire — Coding Test</h1>
        <div class="header-info">
            <span id="problemCount">Loading problems...</span>
        </div>
    </div>

    <div id="loginSection">
        <div style="display: flex; justify-content: center; align-items: center; height: 80vh;">
            <div style="background: #252526; padding: 40px; border-radius: 8px; text-align: center;">
                <h2 style="color: #569cd6; margin-bottom: 20px;">Ready to Start?</h2>
                <button class="btn btn-submit" onclick="loadProblems()">Start Coding Test</button>
            </div>
        </div>
    </div>

    <div id="testSection" class="hidden">
        <div class="problem-selector">
            <label for="problemSelect">Select Problem:</label>
            <select id="problemSelect" onchange="loadProblem()"></select>
        </div>

        <div class="container">
            <div class="problem-panel" id="problemPanel">
                <div style="text-align: center; color: #888; margin-top: 100px;">
                    Select a problem to begin
                </div>
            </div>

            <div class="editor-panel">
                <div class="editor-toolbar">
                    <div class="toolbar-left">
                        <label for="languageSelect">Language:</label>
                        <select id="languageSelect">
                            <option value="python">Python 3</option>
                            <option value="javascript">JavaScript</option>
                            <option value="java">Java</option>
                            <option value="cpp">C++</option>
                        </select>
                    </div>
                    <div class="toolbar-right">
                        <button class="btn btn-run" id="runBtn" onclick="runCode()" disabled>Run Code</button>
                        <button class="btn btn-submit" id="submitBtn" onclick="submitSolution()" disabled>Submit Solution</button>
                    </div>
                </div>

                <div id="editor"></div>

                <div class="output-panel">
                    <h4>Output</h4>
                    <div class="output-content" id="outputContent">Click "Run Code" to test your solution...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Monaco Editor CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
    <script>
        let candidateId = 'candidate-' + Math.random().toString(36).substr(2, 9);
        let problems = [];
        let currentProblem = null;
        let editor = null;

        // Initialize Monaco Editor
        require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' } });

        require(['vs/editor/editor.main'], function () {
            editor = monaco.editor.create(document.getElementById('editor'), {
                value: '# Write your solution here...\n',
                language: 'python',
                theme: 'vs-dark',
                automaticLayout: true,
                fontSize: 14,
                minimap: { enabled: true },
                scrollBeyondLastLine: false
            });

            editor.onDidChangeModelContent(() => {
                document.getElementById('runBtn').disabled = false;
                document.getElementById('submitBtn').disabled = false;
            });
        });

        let retryCount = 0;
        const MAX_RETRIES = 10;

        async function loadProblems() {
            try {
                const response = await fetch('http://localhost:5002/api/coding/problems');

                if (!response.ok) {
                    const error = await response.json();
                    alert(error.error || 'Failed to load problems.');
                    return;
                }

                problems = await response.json();
                populateProblemSelector();

                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('testSection').classList.remove('hidden');
                document.getElementById('problemCount').textContent = `${problems.length} problems available`;
            } catch (error) {
                retryCount++;
                if (retryCount < MAX_RETRIES) {
                    // Auto-retry with increasing delay
                    const delay = Math.min(retryCount * 2000, 10000);
                    console.log(`Backend not available. Retrying in ${delay/1000}s... (${retryCount}/${MAX_RETRIES})`);
                    
                    const loginSection = document.getElementById('loginSection');
                    loginSection.innerHTML = `
                        <div class="login-box">
                            <h2 style="color: #667eea;">⏳ Connecting to Backend...</h2>
                            <p style="color: #ccc; margin-bottom: 15px;">
                                Waiting for Coding Backend (Port 5002) to start.
                            </p>
                            <p style="color: #999; font-size: 13px; margin-bottom: 20px;">
                                Run: <code style="background: #333; padding: 3px 8px; border-radius: 4px;">python main.py</code>
                            </p>
                            <div class="loader" style="width: 40px; height: 40px; border: 4px solid #333; border-top: 4px solid #667eea; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto;"></div>
                            <p style="color: #667eea; font-size: 14px; margin-top: 15px;">
                                Retry ${retryCount}/${MAX_RETRIES} — Auto-retrying in ${delay/1000}s...
                            </p>
                        </div>
                    `;
                    
                    setTimeout(loadProblems, delay);
                } else {
                    // Final failure
                    const loginSection = document.getElementById('loginSection');
                    loginSection.innerHTML = `
                        <div class="login-box">
                            <h2 style="color: #ff6b6b;">❌ Connection Failed</h2>
                            <p style="color: #ccc; margin-bottom: 15px;">
                                Could not connect to Coding Backend after ${MAX_RETRIES} attempts.
                            </p>
                            <p style="color: #999; font-size: 13px; margin-bottom: 20px;">
                                1. Run: <code style="background: #333; padding: 3px 8px; border-radius: 4px;">python main.py</code><br>
                                2. Wait for all services to start<br>
                                3. Click Retry below
                            </p>
                            <button class="btn btn-submit" onclick="location.reload()">🔄 Retry Now</button>
                        </div>
                    `;
                }
            }
        }

        function populateProblemSelector() {
            const select = document.getElementById('problemSelect');
            select.innerHTML = '<option value="">-- Select a problem --</option>';

            problems.forEach(p => {
                const option = document.createElement('option');
                option.value = p.id;
                option.textContent = `[${p.difficulty.toUpperCase()}] ${p.title}`;
                select.appendChild(option);
            });
        }

        async function loadProblem() {
            const problemId = document.getElementById('problemSelect').value;
            if (!problemId) return;

            currentProblem = problems.find(p => p.id === problemId);

            // Update problem panel
            const panel = document.getElementById('problemPanel');
            panel.innerHTML = `
                <div class="problem-title">${currentProblem.title}</div>
                <div class="problem-difficulty ${currentProblem.difficulty}">${currentProblem.difficulty.toUpperCase()}</div>
                <div class="problem-description">${currentProblem.description}</div>
                
                <h3 style="color: #569cd6; margin-bottom: 15px;">Examples:</h3>
                ${currentProblem.examples.map((ex, i) => `
                    <div class="example">
                        <h4>Example ${i + 1}:</h4>
                        <p><strong>Input:</strong> ${ex.input}</p>
                        <p><strong>Output:</strong> ${ex.output}</p>
                    </div>
                `).join('')}

                ${currentProblem.constraints.length > 0 ? `
                    <div class="constraints">
                        <h4>Constraints:</h4>
                        <ul>
                            ${currentProblem.constraints.map(c => `<li>${c}</li>`).join('')}
                        </ul>
                    </div>
                ` : ''}
            `;

            // Set starter code
            if (editor && currentProblem.starter_code_python) {
                editor.setValue(currentProblem.starter_code_python);
            }

            // Clear output
            document.getElementById('outputContent').textContent = 'Click "Run Code" to test your solution...';
            document.getElementById('outputContent').className = 'output-content';
        }

        async function runCode() {
            if (!editor) return;

            const sourceCode = editor.getValue();
            const language = document.getElementById('languageSelect').value;

            const outputEl = document.getElementById('outputContent');
            outputEl.textContent = 'Running...';
            outputEl.className = 'output-content';

            try {
                const response = await fetch('http://localhost:5002/api/coding/execute', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        source_code: sourceCode,
                        language: language,
                        stdin: ''
                    })
                });

                const result = await response.json();

                if (result.stderr || result.compile_output) {
                    outputEl.textContent = `Error:\n${result.stderr || result.compile_output}`;
                    outputEl.classList.add('error');
                } else {
                    outputEl.textContent = `Status: ${result.status}\nTime: ${result.time}s\nMemory: ${result.memory} KB\n\nOutput:\n${result.stdout}`;
                    outputEl.classList.add('success');
                }
            } catch (error) {
                outputEl.textContent = `Error: ${error.message}`;
                outputEl.classList.add('error');
            }
        }

        async function submitSolution() {
            if (!editor || !currentProblem) return;

            if (!confirm('Submit your solution for grading?')) return;

            const sourceCode = editor.getValue();
            const language = document.getElementById('languageSelect').value;

            const outputEl = document.getElementById('outputContent');
            outputEl.textContent = 'Submitting and grading...';
            outputEl.className = 'output-content';

            try {
                const response = await fetch('http://localhost:5002/api/coding/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        candidate_id: candidateId,
                        problem_id: currentProblem.id,
                        source_code: sourceCode,
                        language: language
                    })
                });

                const result = await response.json();

                // Display results
                let output = `Problem: ${result.problem_title}\n`;
                output += `Difficulty: ${result.difficulty}\n`;
                output += `Language: ${result.language}\n\n`;
                output += `═══════════════════════════════\n`;
                output += `RESULTS: ${result.passed}/${result.total} test cases passed\n`;
                output += `Score: ${result.percentage}%\n`;
                output += `═══════════════════════════════\n\n`;

                result.results.forEach(tc => {
                    const status = tc.passed ? '✓ PASSED' : '✗ FAILED';
                    output += `Test Case ${tc.test_case}: ${status}\n`;
                    output += `  Status: ${tc.status}\n`;
                    output += `  Time: ${tc.time}s, Memory: ${tc.memory} KB\n`;
                    if (!tc.passed) {
                        output += `  Expected: ${tc.expected}\n`;
                        output += `  Got: ${tc.stdout}\n`;
                    }
                    output += '\n';
                });

                outputEl.textContent = output;
                outputEl.className = result.percentage >= 50 ? 'output-content success' : 'output-content error';

            } catch (error) {
                outputEl.textContent = `Error: ${error.message}`;
                outputEl.classList.add('error');
            }
        }
    </script>
</body>
</html>
